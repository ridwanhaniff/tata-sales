; TATA SALES — supervisor worker
; Salin ke /etc/supervisor/conf.d/tata-sales-worker.conf
; lalu: sudo supervisorctl reread && sudo supervisorctl update
;
; Verifikasi versi PHP: php -v (ganti php8.3-fpm / php di bawah sesuai versi)

[program:tata-sales-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/tata-sales/artisan queue:work --queue=default --sleep=3 --tries=3 --max-time=3600
directory=/var/www/tata-sales
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/tata-sales/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=10

; Scheduler via cron (tidak perlu supervisor):
;   1. sudo crontab -u www-data -e
;   2. tambahkan baris:
;      * * * * * cd /var/www/tata-sales && php artisan schedule:run >> /dev/null 2>&1
;