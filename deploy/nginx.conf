# TATA SALES — nginx server block
# Salin ke /etc/nginx/sites-available/tata-sales lalu:
#   sudo ln -s /etc/nginx/sites-available/tata-sales /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Ganti: your-domain.com, /var/www/tata-sales

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    root /var/www/tata-sales/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # --- Static assets: cache panjang + gzip ---
    location ~* \.(?:css|js|woff2?|ttf|otf|svg|png|jpe?g|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location /build/manifest.json {
        access_log off;
        try_files $uri =404;
    }

    # --- PHP (Laravel front controller) ---
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # sesuaikan versi PHP
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_index index.php;
        fastcgi_read_timeout 300;
    }

    # --- Keamanan ---
    location ~ /\.(?!well-known).* {
        deny all;
    }
    location ~ ^/(?:storage)/.*\.(?:php|env)$ {
        deny all;
    }
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    access_log /var/log/nginx/tata-sales-access.log;
    error_log /var/log/nginx/tata-sales-error.log;
}

